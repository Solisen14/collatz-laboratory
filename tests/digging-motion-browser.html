<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Digging Deeper controller regression tests</title>
<style>
  body {font:16px system-ui;margin:30px;background:#091322;color:#e5f4ff}
  #fixtures {position:absolute;left:-10000px;width:1000px}
  .deeper-motion-beat {height:500px}
</style>
<h1>Running controller tests…</h1>
<p>Open this file through a local static server. These tests control animation time and the motion preference; visual layout is checked separately.</p>
<pre id="results"></pre>
<div id="fixtures">
  <figure data-motion-source="periodic">Periodicity fallback</figure>
  <div data-motion-source="reflection">Reflection fallback</div>
  <div data-inline-orbit="forward">3 → 10 → 5 → 16 → 8 → 4 → 2 → 1 → 4 → 2 → 1 → ⋯</div>
  <div data-inline-orbit="cycle">1 → 4 → 2 → 1 → ⋯</div>
  <div data-inline-orbit="fixed">−1 → 1 → 1 → 1 → ⋯</div>
</div>
<script>
  const preferenceListeners=[];
  const preference={matches:false,addEventListener:(type,fn)=>preferenceListeners.push(fn)};
  const narrowListeners=[];
  const narrowPreference={matches:false,addEventListener:(type,fn)=>narrowListeners.push(fn)};
  const nativeMatchMedia=window.matchMedia.bind(window);
  window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?preference:q==='(max-width: 600px)'?narrowPreference:nativeMatchMedia(q);
  const frames=new Map();let frameId=0;
  window.requestAnimationFrame=fn=>{frames.set(++frameId,fn);return frameId;};
  window.cancelAnimationFrame=id=>frames.delete(id);
  function frame(time){const batch=[...frames.values()];frames.clear();batch.forEach(fn=>fn(time));}
  function motion(reduced){preference.matches=reduced;preferenceListeners.forEach(fn=>fn({matches:reduced}));}
  function narrowScreen(matches){narrowPreference.matches=matches;narrowListeners.forEach(fn=>fn({matches}));}
</script>
<script src="../digging-motion-model.js"></script>
<script src="../digging-motion.js"></script>
<script src="../digging-inline-orbits.js"></script>
<script>
  const output=document.querySelector('#results');
  let passed=0;
  function check(condition,message){if(!condition)throw new Error(message);output.textContent+='PASS '+message+'\n';passed++;}
  const scene=key=>document.querySelector('#deeper-'+key);
  const click=(key,action)=>scene(key).querySelector('[data-action="'+action+'"]').click();
  const step=key=>Number(scene(key).dataset.step);
  try {
    check(document.querySelectorAll('.deeper-motion-story').length===2,'Both comparison scenes mount');
    check([...document.querySelectorAll('[data-motion-source]')].every(s=>s.hidden),'Fallbacks hide after successful mounting');
    const ids=[...document.querySelectorAll('[id]')].map(e=>e.id);
    check(new Set(ids).size===ids.length,'Scene and SVG IDs are unique');
    motion(true);
    for(const [key,max] of [['periodic',14],['reflection',9]]) {
      check(step(key)===max&&scene(key).dataset.mode==='reduced',key+': reduced motion starts with complete diagram');
      check(scene(key).querySelector('[data-action="play"]').disabled&&scene(key).querySelector('[data-action="scroll"]').disabled,key+': automatic motion controls disabled');
      click(key,'previous');window.dispatchEvent(new Event('scroll'));frame(100);
      check(step(key)===max-1,key+': manual reduced-motion step survives scrolling');
    }
    scene('periodic').querySelector('[data-start="4"]').click();
    check(step('periodic')===9&&scene('periodic').dataset.start==='4','Reduced-motion starting-point switch updates complete example');
    motion(false);
    scene('periodic').querySelector('[data-start="3"]').click();
    click('periodic','play');frame(100);frame(1000);
    check(step('periodic')===1&&scene('periodic').dataset.mode==='play','Playback advances one application per tick');
    click('periodic','play');frame(2000);
    check(step('periodic')===1&&frames.size===0,'Pause cancels playback without advancing');
    click('periodic','play');
    scene('periodic').querySelector('[data-start="4"]').click();frame(3000);
    check(step('periodic')===0&&frames.size===0,'Changing the starting point cancels the previous timer');
    const periodic=scene('periodic');
    const manual=periodic.querySelector('.deeper-motion-manual');
    check(!manual.hidden&&manual.querySelector('h5').textContent===periodic.querySelector('.deeper-motion-equation').textContent,'Manual explanation matches the reset diagram');
    check(periodic.querySelector('.deeper-motion-beats').getAttribute('aria-hidden')==='true','Scroll narrative is excluded while manual controls are active');
    click('periodic','next');
    check(manual.querySelector('h5').textContent==='C1(4) = 2'&&manual.querySelector('p').textContent===periodic.querySelector('.deeper-motion-caption').textContent,'Stepping updates the equation and explanation together');
    click('periodic','scroll');
    check(manual.hidden&&periodic.querySelector('.deeper-motion-beats').getAttribute('aria-hidden')==='false','Follow scroll restores the narrative cards');
    click('periodic','play');motion(true);frame(4000);
    check(step('periodic')===9&&frames.size===0,'Changing motion preference cancels playback and shows complete view');
    motion(false);
    scene('periodic').querySelector('[data-start="3"]').click();click('periodic','play');
    scene('periodic').getBoundingClientRect=()=>({top:innerHeight+100,bottom:innerHeight+600});
    window.dispatchEvent(new Event('scroll'));frame(5000);
    check(scene('periodic').dataset.mode==='manual'&&frames.size===0,'Leaving the viewport pauses playback');
    narrowScreen(true);
    check(step('reflection')===9&&scene('reflection').dataset.mode==='manual','Narrow screens begin with the complete diagram');
    check(!scene('reflection').querySelector('[data-action="play"]').disabled&&scene('reflection').querySelector('[data-action="scroll"]').disabled,'Narrow screens retain manual playback without scroll following');
    click('reflection','previous');window.dispatchEvent(new Event('scroll'));frame(6000);
    check(step('reflection')===8,'Narrow-screen manual step survives scrolling');
    const inline=key=>document.querySelector('[data-inline-orbit="'+key+'"]');
    const values=key=>[...inline(key).querySelectorAll('.inline-orbit-node')].map(n=>Number(n.dataset.value));
    check(values('forward').join(',')==='3,10,5,16,8,4,2,1,4,2,1','Compact forward orbit preserves every ordinary Collatz step');
    check(values('cycle').join(',')==='1,4,2'&&inline('cycle').querySelector('[data-from="2"][data-to="1"]'),'Compact cycle closes at the same node 1');
    check(values('fixed').join(',')==='-1,1'&&inline('fixed').querySelector('[data-from="1"][data-to="1"]'),'Squaring example has an arrival and a genuine self-loop at 1');
    motion(true);
    check(['forward','cycle','fixed'].every(k=>inline(k).dataset.animationState==='reduced'),'Reduced motion shows all three compact diagrams without playing');
    motion(false);
    const replay=key=>inline(key).querySelector('.inline-orbit-replay').click();
    replay('forward');frame(100);frame(6000);
    check(inline('forward').dataset.animationState==='complete'&&inline('forward').dataset.activeValue==='1','Forward trace finishes at 1');
    replay('cycle');frame(10000);frame(11400);
    check(inline('cycle').dataset.animationState==='playing'&&inline('cycle').dataset.activeValue==='4','Cycle animation follows 1 to 4 before reaching 2');
    frame(16300);
    check(inline('cycle').dataset.animationState==='complete'&&inline('cycle').dataset.activeValue==='1','Three cycle laps finish back at 1');
    replay('fixed');frame(20000);frame(21250);
    const fixedPosition=inline('fixed').querySelector('.inline-orbit-marker').getAttribute('transform');
    check(inline('fixed').dataset.activeValue==='1','Squaring animation reaches 1 after its first arrow');
    frame(23000);
    check(inline('fixed').querySelector('.inline-orbit-marker').getAttribute('transform')===fixedPosition,'The fixed point remains in place during its pulse');
    motion(true);frame(26000);
    check(frames.size===0&&inline('fixed').dataset.animationState==='reduced','Motion preference cancels active compact animations');
    document.querySelector('h1').textContent=passed+' controller checks passed';
    document.body.dataset.result='pass';
  } catch(error) {
    output.textContent+='FAIL '+error.message+'\n';
    document.querySelector('h1').textContent='Controller regression failed';
    document.body.dataset.result='fail';throw error;
  }
</script>
</html>
